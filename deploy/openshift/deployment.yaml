apiVersion: apps/v1
kind: Deployment
metadata:
  name: patchmgmt-api
  namespace: patchmgmt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: patchmgmt-api
  template:
    metadata:
      labels:
        app: patchmgmt-api
    spec:
      serviceAccountName: patchmgmt-sa
      containers:
        - name: api
          image: patchmgmt-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: patchmgmt-db
                  key: DATABASE_URL
            - name: KUBE_INCLUSTER
              value: "true"
            # Real-time Kubernetes watch (complements scheduled sync)
            - name: ENABLE_KUBE_WATCH
              value: "true"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: patchmgmt-api
  namespace: patchmgmt
spec:
  selector:
    app: patchmgmt-api
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
