server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Write access log to file (for FluentBit sidecar) and stdout (for kubectl logs)
    access_log /var/log/nginx/access.log;
    access_log /dev/stdout;

    # Proxy API calls to backend Service in the same namespace
    location /api/ {
        proxy_pass http://patchmgmt-api:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Extended timeouts for large-scale refresh operations with dynamic discovery
        proxy_read_timeout 7200s;     # 2 hours
        proxy_connect_timeout 10s;
        proxy_send_timeout 7200s;     # 2 hours
    }

    # Send all SPA routes to index.html (Login and app handled by client routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}


