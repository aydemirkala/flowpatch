<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="ga" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="50%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="gb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
  </defs>
  <!-- Radar rings -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#ga)" stroke-width="1.2" opacity="0.2"/>
  <circle cx="100" cy="100" r="66" fill="none" stroke="url(#ga)" stroke-width="1.2" opacity="0.3"/>
  <circle cx="100" cy="100" r="40" fill="none" stroke="url(#ga)" stroke-width="1.2" opacity="0.5"/>
  <!-- Radar sweep -->
  <path d="M 100 100 L 100 8 A 92 92 0 0 1 179 50 Z" fill="url(#ga)" opacity="0.10"/>
  <!-- Center hub -->
  <circle cx="100" cy="100" r="18" fill="url(#gb)"/>
  <circle cx="100" cy="100" r="12" fill="#fff"/>
  <circle cx="100" cy="100" r="6" fill="url(#gb)"/>
  <circle cx="100" cy="100" r="2.5" fill="#fff"/>
  <!-- Connection lines -->
  <line x1="100" y1="100" x2="152" y2="36" stroke="#a78bfa" stroke-width="1" opacity="0.25" stroke-dasharray="3,3"/>
  <line x1="100" y1="100" x2="34" y2="46" stroke="#10b981" stroke-width="1" opacity="0.25" stroke-dasharray="3,3"/>
  <line x1="100" y1="100" x2="172" y2="118" stroke="#3b82f6" stroke-width="1" opacity="0.25" stroke-dasharray="3,3"/>
  <line x1="100" y1="100" x2="28" y2="148" stroke="#ef4444" stroke-width="1" opacity="0.25" stroke-dasharray="3,3"/>
  <line x1="100" y1="100" x2="118" y2="180" stroke="#f59e0b" stroke-width="1" opacity="0.25" stroke-dasharray="3,3"/>
  <!-- Node: OpenSource -->
  <ellipse cx="152" cy="32" rx="30" ry="11" fill="#8b5cf6" opacity="0.92"/>
  <text x="152" y="36" text-anchor="middle" font-family="Segoe UI,sans-serif" font-weight="700" font-size="11" fill="#fff">OpenSource</text>
  <!-- Node: Security -->
  <ellipse cx="32" cy="42" rx="26" ry="11" fill="#10b981" opacity="0.88"/>
  <text x="32" y="46" text-anchor="middle" font-family="Segoe UI,sans-serif" font-weight="700" font-size="11" fill="#fff">Security</text>
  <!-- Node: K8s -->
  <ellipse cx="174" cy="118" rx="20" ry="11" fill="#3b82f6" opacity="0.85"/>
  <text x="174" y="122" text-anchor="middle" font-family="Segoe UI,sans-serif" font-weight="700" font-size="11" fill="#fff">K8s</text>
  <!-- Node: Patch -->
  <ellipse cx="28" cy="148" rx="22" ry="11" fill="#ef4444" opacity="0.85"/>
  <text x="28" y="152" text-anchor="middle" font-family="Segoe UI,sans-serif" font-weight="700" font-size="11" fill="#fff">Patch</text>
  <!-- Node: Trace -->
  <ellipse cx="118" cy="180" rx="22" ry="11" fill="#f59e0b" opacity="0.8"/>
  <text x="118" y="184" text-anchor="middle" font-family="Segoe UI,sans-serif" font-weight="700" font-size="11" fill="#fff">Trace</text>
</svg>
