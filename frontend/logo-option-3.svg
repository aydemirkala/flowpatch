<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="g3a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="50%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="g3b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
    <linearGradient id="g3c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
  </defs>
  <!-- Radar / scan rings -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#g3a)" stroke-width="3" opacity="0.2"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#g3a)" stroke-width="3" opacity="0.3"/>
  <circle cx="256" cy="256" r="100" fill="none" stroke="url(#g3a)" stroke-width="3" opacity="0.5"/>
  <!-- Radar sweep -->
  <path d="M 256 256 L 256 56 A 200 200 0 0 1 429 156 Z" fill="url(#g3a)" opacity="0.12"/>
  <!-- Center hub -->
  <circle cx="256" cy="256" r="40" fill="url(#g3b)"/>
  <circle cx="256" cy="256" r="28" fill="#fff"/>
  <!-- Eye / scan icon in center -->
  <circle cx="256" cy="256" r="12" fill="url(#g3b)"/>
  <circle cx="256" cy="256" r="5" fill="#fff"/>
  <!-- Connection lines from center to nodes -->
  <line x1="256" y1="256" x2="345" y2="155" stroke="url(#g3c)" stroke-width="2" opacity="0.3" stroke-dasharray="4,4"/>
  <line x1="256" y1="256" x2="140" y2="170" stroke="#10b981" stroke-width="2" opacity="0.3" stroke-dasharray="4,4"/>
  <line x1="256" y1="256" x2="385" y2="300" stroke="#3b82f6" stroke-width="2" opacity="0.3" stroke-dasharray="4,4"/>
  <line x1="256" y1="256" x2="130" y2="340" stroke="#ef4444" stroke-width="2" opacity="0.3" stroke-dasharray="4,4"/>
  <line x1="256" y1="256" x2="290" y2="410" stroke="#f59e0b" stroke-width="2" opacity="0.3" stroke-dasharray="4,4"/>
  <!-- Node: OpenSource (top-right) -->
  <ellipse cx="345" cy="155" rx="42" ry="18" fill="url(#g3c)" opacity="0.9"/>
  <text x="345" y="160" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="600" font-size="11" fill="#fff">OpenSource</text>
  <!-- Node: Security (top-left) -->
  <ellipse cx="140" cy="170" rx="36" ry="18" fill="#10b981" opacity="0.85"/>
  <text x="140" y="175" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="600" font-size="11" fill="#fff">Security</text>
  <!-- Node: K8s (right) -->
  <ellipse cx="385" cy="300" rx="30" ry="18" fill="#3b82f6" opacity="0.8"/>
  <text x="385" y="305" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="600" font-size="11" fill="#fff">K8s</text>
  <!-- Node: Patch (bottom-left) -->
  <ellipse cx="130" cy="340" rx="30" ry="18" fill="#ef4444" opacity="0.8"/>
  <text x="130" y="345" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="600" font-size="11" fill="#fff">Patch</text>
  <!-- Node: Trace (bottom-center) -->
  <ellipse cx="290" cy="410" rx="30" ry="18" fill="#f59e0b" opacity="0.75"/>
  <text x="290" y="415" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="600" font-size="11" fill="#fff">Trace</text>
</svg>
