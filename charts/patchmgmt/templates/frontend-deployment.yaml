{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "patchmgmt.fullname" . }}-frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "patchmgmt.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "patchmgmt.fullname" . }}-frontend
  template:
    metadata:
      labels:
        app: {{ include "patchmgmt.fullname" . }}-frontend
        {{- include "patchmgmt.labels" . | nindent 8 }}
    spec:
      containers:
        - name: frontend
          image: {{ .Values.frontend.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: nginx-logs
              mountPath: /var/log/nginx
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
        {{- if .Values.frontend.fluentbit.enabled }}
        - name: fluentbit
          image: {{ .Values.frontend.fluentbit.image | quote }}
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: nginx-logs
              mountPath: /var/log/nginx
              readOnly: true
            - name: fluentbit-config
              mountPath: /fluent-bit/etc
              readOnly: true
          resources:
            {{- toYaml .Values.frontend.fluentbit.resources | nindent 12 }}
        {{- end }}
      {{- with .Values.frontend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: nginx-logs
          emptyDir: {}
        {{- if .Values.frontend.fluentbit.enabled }}
        - name: fluentbit-config
          configMap:
            name: {{ include "patchmgmt.fullname" . }}-fluentbit-frontend
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "patchmgmt.fullname" . }}-frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "patchmgmt.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ include "patchmgmt.fullname" . }}-frontend
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: 8080
      protocol: TCP
{{- end }}

